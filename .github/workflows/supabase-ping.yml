name: Daily Supabase Ping

# Prevent auto-pause of Supabase free-tier project (pauses after 7 days of inactivity).
# Runs daily at 03:00 UTC (off-peak).

on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:  # Manual trigger for testing

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase (health check)
        run: |
          HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" \
            "${{ secrets.SUPABASE_URL }}/rest/v1/children?select=id&limit=1" \
            -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_ANON_KEY }}")
          
          if [ "$HTTP_CODE" = "200" ]; then
            echo "✅ Supabase ping OK (HTTP $HTTP_CODE)"
          else
            echo "❌ Supabase ping returned HTTP $HTTP_CODE"
            exit 1
          fi
