# Kapoori Ka — Function Compute (nginx) production host config.
# Tracked here so the SPA routing + security-header policy is version-controlled.
# The nginx environment extracts this to /code and runs `nginx -c /code/nginx.conf`
# on port 9000. Filesystem is read-only except /tmp, so all temp paths use /tmp.

user root;
worker_processes 1;
daemon off;
pid /tmp/nginx.pid;
error_log /tmp/nginx-error.log warn;
events { worker_connections 1024; }
http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log /tmp/nginx-access.log;
    client_body_temp_path /tmp/nginx-client-body;
    proxy_temp_path /tmp/nginx-proxy;
    fastcgi_temp_path /tmp/nginx-fastcgi;
    uwsgi_temp_path /tmp/nginx-uwsgi;
    scgi_temp_path /tmp/nginx-scgi;
    sendfile on;
    server {
        listen 9000;
        server_name _;
        root /code;
        index index.html index.htm;

        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header X-Frame-Options DENY always;
        add_header Permissions-Policy "camera=(self), geolocation=(), microphone=(), payment=(), usb=()" always;
        add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; connect-src 'self' https://*.supabase.co https://accounts.google.com; img-src 'self' data: blob: https://*.supabase.co; style-src 'self' 'unsafe-inline'; script-src 'self'; manifest-src 'self'; worker-src 'self' blob:; upgrade-insecure-requests" always;

        # SPA fallback: deep links and /auth/callback resolve to index.html.
        location / { try_files $uri $uri/ /index.html; }
    }
}
