# Netlify config — Kapoori Ka web pages (payment + admin + guide)
[build]
  # No build step: these are static HTML files served straight from netlify/
  command = ""
  publish = "netlify"

# Make the bare root URL land on the public payment page instead of 404ing
[[redirects]]
  from = "/"
  to = "/payment.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://tgnzucqjebnisgrxjfjg.supabase.co; connect-src 'self' https://tgnzucqjebnisgrxjfjg.supabase.co https://tgnzucqjebnisgrxjfjg.functions.supabase.co; font-src 'self'; object-src 'none'; base-uri 'none'; frame-ancestors 'none'; form-action 'self'"
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=(), usb=()"

[[headers]]
  for = "/vendor/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/payment.html"
  [headers.values]
    Cache-Control = "no-store"

[[headers]]
  for = "/admin/*"
  [headers.values]
    Cache-Control = "no-store"
